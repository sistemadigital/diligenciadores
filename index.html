<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diligenciadores - Bus Federal</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background-color:#f9fafb;color:#333;}
    
    #admin{
        padding:20px;
        max-width:1250px;
        margin:auto;
    }
    
    .header-admin{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
        border-bottom:2px solid #ddd;
        padding-bottom:10px;
    }
    
    h2{font-size:1.8rem;color:#2c3e50;}
    p.subtitulo{color:#555;margin-bottom:15px;}
    
    button.btn{
        padding:12px 30px;
        background-color:#3498db;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-size:1rem;
        transition:0.3s;
    }
    
    button.btn:hover{background-color:#2980b9;}
    
    .filtros{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
        gap:15px;
        margin-bottom:20px;
        background:white;
        padding:15px;
        border-radius:8px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    
    .filtro-grupo label{
        font-weight:500;
        margin-bottom:5px;
        display:block;
    }
    
    .filtro-grupo input,
    .filtro-grupo select{
        width:100%;
        padding:8px;
        border:1px solid #ccc;
        border-radius:4px;
    }
    
    .provincias-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
        gap:20px;
        margin-top:20px;
    }
    
    .provincia-card{
        background:white;
        border-radius:8px;
        padding:20px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        cursor:pointer;
        transition:transform 0.3s, box-shadow 0.3s;
        border-left:5px solid #3498db;
    }
    
    .provincia-card:hover{
        transform:translateY(-5px);
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }
    
    .provincia-card h3{
        color:#2c3e50;
        margin-bottom:10px;
        font-size:1.2rem;
    }
    
    .provincia-card p{
        color:#666;
        font-size:0.9rem;
    }
    
    /* Pestañas dentro del modal */
    .tabs {
        display: flex;
        gap: 2px;
        background: #f8fafc;
        border-bottom: 1px solid #dce9f0;
        margin-bottom: 15px;
    }
    .tab-btn {
        background: none;
        border: none;
        padding: 10px 20px;
        font-weight: 600;
        color: #386a81;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: 0.2s;
    }
    .tab-btn.active {
        color: #1f7e9e;
        border-bottom-color: #1f7e9e;
    }
    .tab-pane {
        display: none;
    }
    .tab-pane.active {
        display: block;
    }
    .req-card {
        background: #f0f9fe;
        border-radius: 20px;
        padding: 1rem;
        margin-bottom: 1rem;
        border-left: 5px solid #f4b942;
    }
    .pages-highlight {
        background: #fff3cf;
        padding: 8px 12px;
        border-radius: 16px;
        font-weight: bold;
        margin: 10px 0;
        display: inline-block;
    }
    .req-list {
        padding-left: 1.2rem;
        margin: 0.8rem 0;
    }
    .req-list li {
        margin-bottom: 6px;
    }
    
    table{
        width:100%;
        border-collapse:collapse;
        background:white;
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        margin-top:20px;
    }
    
    th,td{
        padding:12px 15px;
        text-align:left;
        border-bottom:1px solid #eee;
    }
    
    th{background-color:#f4f6f7;}
    tr:hover{background-color:#f1f9ff;}
    
    .acciones{
        display:flex;
        gap:10px;
    }
    
    .btn-editar{
        background-color:#1e8449;
        color:white;
        border:none;
        padding:6px 12px;
        border-radius:4px;
        cursor:pointer;
    }
    
    .btn-eliminar{
        background-color:#e74c3c;
        color:white;
        border:none;
        padding:6px 12px;
        border-radius:4px;
        cursor:pointer;
    }
    
    .paginacion{
        text-align:center;
        margin-top:15px;
    }
    
    .pagina{
        display:inline-block;
        padding:6px 12px;
        margin:0 3px;
        border:1px solid #ccc;
        border-radius:4px;
        cursor:pointer;
    }
    
    .pagina.activa{
        background-color:#3498db;
        color:white;
    }
    
    .modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.4);
        justify-content:center;
        align-items:center;
        z-index:999;
        padding:20px;
    }
    
    .modal.activa{display:flex;}
    
    .modal-contenido{
        background:white;
        padding:20px;
        border-radius:8px;
        max-width:900px;
        width:100%;
        max-height:90vh;
        box-shadow:0 5px 15px rgba(0,0,0,0.3);
        display:flex;
        flex-direction:column;
    }
    
    .modal-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-bottom:1px solid #ddd;
        margin-bottom:10px;
        padding-bottom:10px;
    }
    
    .modal-header h2{font-size:1.3rem;}
    
    .modal-cerrar{
        font-size:1.5rem;
        background:none;
        border:none;
        cursor:pointer;
        color:#999;
    }
    
    .modal-body{
        flex:1;
        overflow-y:auto;
        padding:5px;
    }
    
    .form-grupo{
        margin-bottom:15px;
    }
    
    .form-grupo label{
        display:block;
        margin-bottom:5px;
        font-weight:500;
    }
    
    .form-grupo input,
    .form-grupo select,
    .form-grupo textarea{
        width:100%;
        padding:8px;
        border:1px solid #ccc;
        border-radius:4px;
    }
    
    .tipo-ley-opciones{
        display:flex;
        gap:10px;
        margin-top:5px;
    }
    
    .tipo-ley-btn{
        flex:1;
        padding:10px;
        border:none;
        color:white;
        border-radius:4px;
        cursor:pointer;
        font-weight:600;
        opacity:0.7;
        transition:0.3s;
    }
    
    .tipo-ley-btn.oficio{
        background-color:#3498db;
    }
    
    .tipo-ley-btn.cedula{
        background-color:#9b59b6;
    }
    
    .tipo-ley-btn.activa{
        opacity:1;
    }
    
    .tipo-ley-btn:hover{
        opacity:0.9;
    }
    
    .modal-footer{
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:15px;
        border-top:1px solid #eee;
        padding-top:15px;
    }
    
    .alerta{
        position:fixed;
        bottom:20px;
        right:20px;
        background:#2ecc71;
        color:white;
        padding:12px 20px;
        border-radius:8px;
        box-shadow:0 3px 10px rgba(0,0,0,0.2);
        z-index:1000;
    }
    
    .acciones-superiores{
        display:flex;
        justify-content:space-between;
        margin-bottom:15px;
    }
    
    .modal-tabla-container{
        max-height:400px;
        overflow-y:auto;
        margin-top:15px;
        border:1px solid #eee;
        border-radius:4px;
    }
    
    .badge-tipo{
        padding:6px 10px;
        border-radius:5px;
        color:white;
        font-weight:bold;
        display:inline-block;
        text-align:center;
        min-width:80px;
    }
    
    .badge-oficio{
        background-color:#3498db;
    }
    
    .badge-cedula{
        background-color:#9b59b6;
    }

    /* ESTILO ESPECÍFICO PARA MODAL DE MAPA FULLSCREEN */
    #modalMapa {
        padding: 0; /* Elimina el padding del overlay */
    }
    #modalMapa .modal-contenido {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border-radius: 0;
        padding: 0;
    }
    #modalMapa .modal-header {
        padding: 10px 20px;
        margin-bottom: 0;
        background: #fff;
    }
    #modalMapa .modal-body {
        padding: 0;
    }

    @media print {
        body * { visibility: hidden; }
        #admin, #admin * { visibility: visible; }
        #admin { position: absolute; top: 0; left: 0; width: 100%; }
        .filtros, .paginacion, .acciones, .header-admin button,
        .provincias-grid { display: none !important; }
        
        .modal.activa, .modal.activa * {
            visibility: visible;
            display: block;
            position: static;
            background: white;
            max-height: none;
            overflow: visible;
        }
        
        .modal-contenido {
            box-shadow: none;
            max-width: none;
            max-height: none;
        }
        
        .modal-header, .modal-footer {
            display: none !important;
        }
        
        .modal-body {
            overflow: visible;
            max-height: none;
        }
    }
    
    @media (max-width: 768px) {
        .header-admin {
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }
        
        .provincias-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        
        .modal-contenido {
            padding: 15px;
        }
        
        .tipo-ley-opciones {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<section id="admin">
  <div class="header-admin">
    <div>
      <h2>⚖️ Diligenciadores - Bus Federal</h2>
      <p class="subtitulo">Gestión de cédulas y oficios Ley 22.172 · Requisitos por provincia (hojas máximas PDF)</p>
    </div>
    <div>
      <button class="btn" id="btnNuevo">Nuevo Diligenciador</button>

</section>

<div class="modal" id="modalProvincia">

        <div class="paginacion" id="paginacionProvincia"></div>

    <div class="modal-footer">

</div>

<div class="modal" id="modalRegistro">

<script type="module">

function cargarProvincias() {
  const container = document.getElementById('provinciasContainer');
  const filtroProv = document.getElementById('filtroProvincia');
  const modalProv = document.getElementById('provincia');
  container.innerHTML = '';
  filtroProv.innerHTML = '<option value="">Todas las provincias</option>';
  modalProv.innerHTML = '<option value="">Seleccione una provincia</option>';
  
  provinciasArgentinas.forEach(prov => {
    const card = document.createElement('div');
    card.className = 'provincia-card';
    const count = diligenciadores.filter(d => d.provincia === prov).length;
    card.innerHTML = `<h3>${prov}</h3><p>${count} diligenciador(es)</p>`;
    card.onclick = () => abrirModalProvincia(prov);
    container.appendChild(card);
    filtroProv.innerHTML += `<option value="${prov}">${prov}</option>`;
    modalProv.innerHTML += `<option value="${prov}">${prov}</option>`;
  });
  document.getElementById('contadorRegistros').textContent = `Total: ${diligenciadores.length}`;
}

async function cargarDatos() {
  try {
    const snapshot = await getDocs(collection(db, 'diligenciadores'));
    diligenciadores = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
    cargarProvincias();
    if (provinciaActual) aplicarFiltrosProvincia();
  } catch(e) { console.error(e); }
}

function abrirModalProvincia(prov) {
  provinciaActual = prov;
  document.getElementById('provinciaNombre').textContent = prov;
  const data = guiaRequisitos[prov] || guiaRequisitos["Buenos Aires"];
  document.getElementById('requisitosContent').innerHTML = `
    <div class="req-card">
      <strong>📄 Límite de hojas/páginas PDF:</strong>
      <div class="pages-highlight">✂️ ${data.maxPaginas}</div>
      <ul class="req-list">
        <li>✅ Firma digital obligatoria.</li>
        <li>📌 ${data.datoClave}</li>
      </ul>
    </div>`;
  document.getElementById('modalProvincia').classList.add('activa');
  aplicarFiltrosProvincia();
}

async function guardarRegistro() {
  const data = {
    provincia: document.getElementById('provincia').value,
    diligenciador: document.getElementById('diligenciador').value,
    domicilio: document.getElementById('domicilio').value,
    localidad: document.getElementById('localidad').value,
    telefono: document.getElementById('telefono').value,
    email: document.getElementById('email').value,
    expteDondeFigura: document.getElementById('expteDondeFigura').value,
    tipoLey: document.getElementById('tipoLey').value
  };
  if (!data.provincia || !data.tipoLey) return alert('Complete los campos');
  if (editandoId) await updateDoc(doc(db, 'diligenciadores', editandoId), data);
  else await addDoc(collection(db, 'diligenciadores'), data);
  document.getElementById('modalRegistro').classList.remove('activa');
  await cargarDatos();
}

function aplicarFiltrosProvincia() {
  const texto = document.getElementById('filtroProvinciaTexto').value.toLowerCase();
  const tipo = document.getElementById('filtroProvinciaTipoLey').value;
  diligenciadoresFiltrados = diligenciadores.filter(d => 
    d.provincia === provinciaActual &&
    (!texto || d.diligenciador?.toLowerCase().includes(texto)) &&
    (!tipo || d.tipoLey === tipo)
  );
  paginaActual = 1;
  renderTabla();
}

function renderTabla() {
  const inicio = (paginaActual-1)*registrosPorPagina;
  const datos = diligenciadoresFiltrados.slice(inicio, inicio+registrosPorPagina);
  document.getElementById('tablaDiligenciadoresCuerpo').innerHTML = datos.map(d => `
    <tr>
      <td>${d.diligenciador}</td><td>${d.domicilio}</td><td>${d.localidad}</td>
      <td>${d.telefono}</td><td>${d.email}</td>
      <td><span class="badge-tipo ${d.tipoLey==='Oficio Ley'?'badge-oficio':'badge-cedula'}">${d.tipoLey}</span></td>
      <td>${d.expteDondeFigura||''}</td>
      <td class="acciones"><button class="btn-editar" onclick="editar('${d.id}')">E</button></td>
    </tr>`).join('');
}

// Eventos Mapa
document.getElementById('btnMapa').onclick = () => {
  document.getElementById('iframeMapa').src = "https://sistemadigital.github.io/ingreso-sistema/mapa-argentina.html";
  document.getElementById('modalMapa').classList.add('activa');
};
document.getElementById('modalMapaCerrar').onclick = () => {
  document.getElementById('modalMapa').classList.remove('activa');
  document.getElementById('iframeMapa').src = "";
};

// Resto de eventos
document.getElementById('btnNuevo').onclick = () => {
  editandoId = null;
  document.getElementById('formRegistro').reset();
  document.getElementById('modalRegistro').classList.add('activa');
};
document.getElementById('btnGuardarRegistro').onclick = guardarRegistro;
document.getElementById('modalRegistroCerrar').onclick = () => document.getElementById('modalRegistro').classList.remove('activa');
document.getElementById('modalProvinciaCerrar').onclick = () => document.getElementById('modalProvincia').classList.remove('activa');
document.getElementById('filtroProvinciaTexto').oninput = aplicarFiltrosProvincia;
document.getElementById('filtroProvinciaTipoLey').onchange = aplicarFiltrosProvincia;

document.querySelectorAll('.tipo-ley-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tipo-ley-btn').forEach(b=>b.classList.remove('activa'));
    btn.classList.add('activa');
    document.getElementById('tipoLey').value = btn.dataset.tipo;
  };
});

window.editar = (id) => {
  const d = diligenciadores.find(x => x.id === id);
  editandoId = id;
  document.getElementById('provincia').value = d.provincia;
  document.getElementById('diligenciador').value = d.diligenciador;
  document.getElementById('tipoLey').value = d.tipoLey;
  document.getElementById('modalRegistro').classList.add('activa');
};

cargarDatos();
</script>
</body>
</html>
