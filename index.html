<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diligenciadores - Bus Federal</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background-color:#f9fafb;color:#333;}
    
    #admin{
        padding:20px;
        max-width:1250px;
        margin:auto;
    }
    
    .header-admin{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
        border-bottom:2px solid #ddd;
        padding-bottom:10px;
    }
    
    h2{font-size:1.8rem;color:#2c3e50;}
    p.subtitulo{color:#555;margin-bottom:15px;}
    
    button.btn{
        padding:12px 30px;
        background-color:#3498db;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-size:1rem;
        transition:0.3s;
    }
    
    button.btn:hover{background-color:#2980b9;}
    
    .filtros{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
        gap:15px;
        margin-bottom:20px;
        background:white;
        padding:15px;
        border-radius:8px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    
    .filtro-grupo label{
        font-weight:500;
        margin-bottom:5px;
        display:block;
    }
    
    .filtro-grupo input,
    .filtro-grupo select{
        width:100%;
        padding:8px;
        border:1px solid #ccc;
        border-radius:4px;
    }
    
    .provincias-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
        gap:20px;
        margin-top:20px;
    }
    
    .provincia-card{
        background:white;
        border-radius:8px;
        padding:20px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        cursor:pointer;
        transition:transform 0.3s, box-shadow 0.3s;
        border-left:5px solid #3498db;
    }
    
    .provincia-card:hover{
        transform:translateY(-5px);
        box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }
    
    .provincia-card h3{
        color:#2c3e50;
        margin-bottom:10px;
        font-size:1.2rem;
    }
    
    .provincia-card p{
        color:#666;
        font-size:0.9rem;
    }
    
    /* Pestañas dentro del modal */
    .tabs {
        display: flex;
        gap: 2px;
        background: #f8fafc;
        border-bottom: 1px solid #dce9f0;
        margin-bottom: 15px;
    }
    .tab-btn {
        background: none;
        border: none;
        padding: 10px 20px;
        font-weight: 600;
        color: #386a81;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: 0.2s;
    }
    .tab-btn.active {
        color: #1f7e9e;
        border-bottom-color: #1f7e9e;
    }
    .tab-pane {
        display: none;
    }
    .tab-pane.active {
        display: block;
    }
    .req-card {
        background: #f0f9fe;
        border-radius: 20px;
        padding: 1rem;
        margin-bottom: 1rem;
        border-left: 5px solid #f4b942;
    }
    .pages-highlight {
        background: #fff3cf;
        padding: 8px 12px;
        border-radius: 16px;
        font-weight: bold;
        margin: 10px 0;
        display: inline-block;
    }
    .req-list {
        padding-left: 1.2rem;
        margin: 0.8rem 0;
    }
    .req-list li {
        margin-bottom: 6px;
    }
    
    table{
        width:100%;
        border-collapse:collapse;
        background:white;
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        margin-top:20px;
    }
    
    th,td{
        padding:12px 15px;
        text-align:left;
        border-bottom:1px solid #eee;
    }
    
    th{background-color:#f4f6f7;}
    tr:hover{background-color:#f1f9ff;}
    
    .acciones{
        display:flex;
        gap:10px;
    }
    
    .btn-editar{
        background-color:#1e8449;
        color:white;
        border:none;
        padding:6px 12px;
        border-radius:4px;
        cursor:pointer;
    }
    
    .btn-eliminar{
        background-color:#e74c3c;
        color:white;
        border:none;
        padding:6px 12px;
        border-radius:4px;
        cursor:pointer;
    }
    
    .paginacion{
        text-align:center;
        margin-top:15px;
    }
    
    .pagina{
        display:inline-block;
        padding:6px 12px;
        margin:0 3px;
        border:1px solid #ccc;
        border-radius:4px;
        cursor:pointer;
    }
    
    .pagina.activa{
        background-color:#3498db;
        color:white;
    }
    
    .modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.4);
        justify-content:center;
        align-items:center;
        z-index:999;
        padding:20px;
    }
    
    .modal.activa{display:flex;}
    
    .modal-contenido{
        background:white;
        padding:20px;
        border-radius:8px;
        max-width:900px;
        width:100%;
        max-height:90vh;
        box-shadow:0 5px 15px rgba(0,0,0,0.3);
        display:flex;
        flex-direction:column;
    }
    
    .modal-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-bottom:1px solid #ddd;
        margin-bottom:10px;
        padding-bottom:10px;
    }
    
    .modal-header h2{font-size:1.3rem;}
    
    .modal-cerrar{
        font-size:1.5rem;
        background:none;
        border:none;
        cursor:pointer;
        color:#999;
    }
    
    .modal-body{
        flex:1;
        overflow-y:auto;
        padding:5px;
    }
    
    .form-grupo{
        margin-bottom:15px;
    }
    
    .form-grupo label{
        display:block;
        margin-bottom:5px;
        font-weight:500;
    }
    
    .form-grupo input,
    .form-grupo select,
    .form-grupo textarea{
        width:100%;
        padding:8px;
        border:1px solid #ccc;
        border-radius:4px;
    }
    
    .tipo-ley-opciones{
        display:flex;
        gap:10px;
        margin-top:5px;
    }
    
    .tipo-ley-btn{
        flex:1;
        padding:10px;
        border:none;
        color:white;
        border-radius:4px;
        cursor:pointer;
        font-weight:600;
        opacity:0.7;
        transition:0.3s;
    }
    
    .tipo-ley-btn.oficio{
        background-color:#3498db;
    }
    
    .tipo-ley-btn.cedula{
        background-color:#9b59b6;
    }
    
    .tipo-ley-btn.activa{
        opacity:1;
    }
    
    .tipo-ley-btn:hover{
        opacity:0.9;
    }
    
    .modal-footer{
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:15px;
        border-top:1px solid #eee;
        padding-top:15px;
    }
    
    .alerta{
        position:fixed;
        bottom:20px;
        right:20px;
        background:#2ecc71;
        color:white;
        padding:12px 20px;
        border-radius:8px;
        box-shadow:0 3px 10px rgba(0,0,0,0.2);
        z-index:1000;
    }
    
    .acciones-superiores{
        display:flex;
        justify-content:space-between;
        margin-bottom:15px;
    }
    
    .modal-tabla-container{
        max-height:400px;
        overflow-y:auto;
        margin-top:15px;
        border:1px solid #eee;
        border-radius:4px;
    }
    
    .badge-tipo{
        padding:6px 10px;
        border-radius:5px;
        color:white;
        font-weight:bold;
        display:inline-block;
        text-align:center;
        min-width:80px;
    }
    
    .badge-oficio{
        background-color:#3498db;
    }
    
    .badge-cedula{
        background-color:#9b59b6;
    }
    
    @media print {
        body * { visibility: hidden; }
        #admin, #admin * { visibility: visible; }
        #admin { position: absolute; top: 0; left: 0; width: 100%; }
        .filtros, .paginacion, .acciones, .header-admin button,
        .provincias-grid { display: none !important; }
        
        .modal.activa, .modal.activa * {
            visibility: visible;
            display: block;
            position: static;
            background: white;
            max-height: none;
            overflow: visible;
        }
        
        .modal-contenido {
            box-shadow: none;
            max-width: none;
            max-height: none;
        }
        
        .modal-header, .modal-footer {
            display: none !important;
        }
        
        .modal-body {
            overflow: visible;
            max-height: none;
        }
    }
    
    @media (max-width: 768px) {
        .header-admin {
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }
        
        .provincias-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        
        .modal-contenido {
            padding: 15px;
        }
        
        .tipo-ley-opciones {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<section id="admin">
  <div class="header-admin">
    <div>
      <h2>⚖️ Diligenciadores - Bus Federal</h2>
      <p class="subtitulo">Gestión de cédulas y oficios Ley 22.172 · Requisitos por provincia (hojas máximas PDF)</p>
    </div>
    <div>
      <button class="btn" id="btnNuevo">Nuevo Diligenciador</button>
      <button class="btn" id="btnImprimir">Imprimir Listado</button>
    </div>
  </div>

  <div class="filtros">
    <div class="filtro-grupo">
      <label>Buscar</label>
      <input type="text" id="filtroTexto" placeholder="Nombre, localidad, email...">
    </div>
    <div class="filtro-grupo">
      <label>Provincia</label>
      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
      </select>
    </div>
    <div class="filtro-grupo">
      <label>Tipo Ley</label>
      <select id="filtroTipoLey">
        <option value="">Ambos</option>
        <option value="Oficio Ley">Oficio Ley</option>
        <option value="Cédula Ley">Cédula Ley</option>
      </select>
    </div>
  </div>

  <div class="acciones-superiores">
    <div id="contadorRegistros">Total de diligenciadores: 0</div>
  </div>

  <div id="provinciasContainer" class="provincias-grid"></div>
</section>

<!-- Modal con pestañas: REQUISITOS BUS FEDERAL + DILIGENCIADORES -->
<div class="modal" id="modalProvincia">
  <div class="modal-contenido">
    <div class="modal-header">
      <h2><span id="provinciaNombre"></span></h2>
      <button class="modal-cerrar" id="modalProvinciaCerrar">&times;</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="requisitos">📌 Requisitos BUS Federal</button>
      <button class="tab-btn" data-tab="diligenciadores">👥 Diligenciadores</button>
    </div>

    <div class="modal-body">
      <!-- Contenido de la pestaña Requisitos -->
      <div id="tabRequisitos" class="tab-pane active">
        <div id="requisitosContent"></div>
      </div>
      
      <!-- Contenido de la pestaña Diligenciadores -->
      <div id="tabDiligenciadores" class="tab-pane">
        <div class="filtros" style="margin-top:0;padding:10px;">
          <div class="filtro-grupo">
            <label>Buscar en la provincia</label>
            <input type="text" id="filtroProvinciaTexto" placeholder="Buscar diligenciadores...">
          </div>
          <div class="filtro-grupo">
            <label>Tipo Ley</label>
            <select id="filtroProvinciaTipoLey">
              <option value="">Ambos</option>
              <option value="Oficio Ley">Oficio Ley</option>
              <option value="Cédula Ley">Cédula Ley</option>
            </select>
          </div>
        </div>
        
        <div class="modal-tabla-container">
          <table id="tablaDiligenciadores">
            <thead>
              <tr>
                <th>Diligenciador</th>
                <th>Domicilio</th>
                <th>Localidad</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Tipo Ley</th>
                <th>Expte donde figura</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaDiligenciadoresCuerpo"></tbody>
          </table>
        </div>
        
        <div class="paginacion" id="paginacionProvincia"></div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn" id="btnImprimirProvincia">Imprimir Listado</button>
      <button class="btn" id="btnCerrarProvincia">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal para registro/edición de diligenciador -->
<div class="modal" id="modalRegistro">
  <div class="modal-contenido">
    <div class="modal-header">
      <h2 id="modalRegistroTitulo">Nuevo Diligenciador</h2>
      <button class="modal-cerrar" id="modalRegistroCerrar">&times;</button>
    </div>
    
    <div class="modal-body">
      <form id="formRegistro">
        <div class="form-grupo">
          <label>Provincia</label>
          <select id="provincia">
            <option value="">Seleccione una provincia</option>
          </select>
        </div>
        
        <div class="form-grupo">
          <label>Diligenciador</label>
          <input type="text" id="diligenciador" placeholder="Nombre del diligenciador">
        </div>
        
        <div class="form-grupo">
          <label>Domicilio</label>
          <input type="text" id="domicilio" placeholder="Dirección completa">
        </div>
        
        <div class="form-grupo">
          <label>Localidad</label>
          <input type="text" id="localidad" placeholder="Localidad">
        </div>
        
        <div class="form-grupo">
          <label>Teléfono</label>
          <input type="tel" id="telefono" placeholder="Número de contacto">
        </div>
        
        <div class="form-grupo">
          <label>Email</label>
          <input type="email" id="email" placeholder="Correo electrónico">
        </div>
        
        <div class="form-grupo">
          <label style="font-weight: bold;">Expte donde figura</label>
          <input type="text" id="expteDondeFigura" placeholder="Número de expediente">
        </div>
        
        <div class="form-grupo">
          <label>Tipo Ley</label>
          <div class="tipo-ley-opciones" id="grupoTipoLey">
            <button type="button" class="tipo-ley-btn oficio" data-tipo="Oficio Ley">Oficio Ley</button>
            <button type="button" class="tipo-ley-btn cedula" data-tipo="Cédula Ley">Cédula Ley</button>
          </div>
          <input type="hidden" id="tipoLey">
        </div>
      </form>
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn" id="btnCancelarRegistro">Cancelar</button>
      <button type="button" class="btn" id="btnGuardarRegistro">Guardar</button>
    </div>
  </div>
</div>

<div id="alerta" class="alerta" style="display:none;"></div>

// ==================== FUNCIONES PRINCIPALES ====================
function cargarProvincias() {
  provinciasContainer.innerHTML = '';
  const filtroProvinciaSelect = document.getElementById('filtroProvincia');
  const provinciaSelect = document.getElementById('provincia');
  filtroProvinciaSelect.innerHTML = '<option value="">Todas las provincias</option>';
  provinciaSelect.innerHTML = '<option value="">Seleccione una provincia</option>';
  
  provinciasArgentinas.forEach(provincia => {
    const card = document.createElement('div');
    card.className = 'provincia-card';
    card.dataset.provincia = provincia;
    const count = diligenciadores.filter(d => d.provincia === provincia).length;
    card.innerHTML = `<h3>${provincia}</h3><p>${count} diligenciador(es) registrado(s)</p>`;
    card.onclick = () => abrirModalProvincia(provincia);
    provinciasContainer.appendChild(card);
    
    const opcionFiltro = document.createElement('option');
    opcionFiltro.value = provincia;
    opcionFiltro.textContent = provincia;
    filtroProvinciaSelect.appendChild(opcionFiltro);
    
    const opcionProvincia = document.createElement('option');
    opcionProvincia.value = provincia;
    opcionProvincia.textContent = provincia;
    provinciaSelect.appendChild(opcionProvincia);
  });
  contadorRegistros.textContent = `Total de diligenciadores: ${diligenciadores.length}`;
}

async function cargarDatosDemo() {
  for (const demo of registrosDemo) {
    await addDoc(collection(db, 'diligenciadores'), demo);
  }
}

async function cargarDatos() {
  try {
    const querySnapshot = await getDocs(collection(db, 'diligenciadores'));
    let docs = querySnapshot.docs.map(d => ({id: d.id, ...d.data()}));
    if (docs.length === 0) {
      await cargarDatosDemo();
      const nuevoSnapshot = await getDocs(collection(db, 'diligenciadores'));
      docs = nuevoSnapshot.docs.map(d => ({id: d.id, ...d.data()}));
    }
    diligenciadores = docs.sort((a,b) => (a.provincia||'').localeCompare(b.provincia||'') || (a.diligenciador||'').localeCompare(b.diligenciador||''));
    cargarProvincias();
    if (provinciaActual) aplicarFiltrosProvincia();
  } catch(error) {
    mostrarAlerta('Error al cargar datos: ' + error.message, '#e74c3c');
  }
}

function abrirModalProvincia(provincia) {
  provinciaActual = provincia;
  document.getElementById('provinciaNombre').innerHTML = provincia;
  document.getElementById('requisitosContent').innerHTML = getRequisitosHTML(provincia);
  modalProvincia.classList.add('activa');
  document.getElementById('filtroProvinciaTexto').value = "";
  document.getElementById('filtroProvinciaTipoLey').value = "";
  aplicarFiltrosProvincia();
  // Activar pestaña de requisitos por defecto
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="requisitos"]').classList.add('active');
  document.getElementById('tabRequisitos').classList.add('active');
  document.getElementById('tabDiligenciadores').classList.remove('active');
}

function cerrarModalProvincia() {
  modalProvincia.classList.remove('activa');
  provinciaActual = "";
}

function abrirModalRegistro(diligenciador = null) {
  modalRegistro.classList.add('activa');
  document.getElementById('formRegistro').reset();
  document.querySelectorAll('.tipo-ley-btn').forEach(b => b.classList.remove('activa'));
  if (diligenciador) {
    document.getElementById('modalRegistroTitulo').textContent = 'Editar Diligenciador';
    document.getElementById('provincia').value = diligenciador.provincia;
    document.getElementById('diligenciador').value = diligenciador.diligenciador;
    document.getElementById('domicilio').value = diligenciador.domicilio;
    document.getElementById('localidad').value = diligenciador.localidad;
    document.getElementById('telefono').value = diligenciador.telefono;
    document.getElementById('email').value = diligenciador.email;
    document.getElementById('expteDondeFigura').value = diligenciador.expteDondeFigura || '';
    const tipo = diligenciador.tipoLey;
    const btn = document.querySelector(`.tipo-ley-btn[data-tipo="${tipo}"]`);
    if (btn) { btn.classList.add('activa'); document.getElementById('tipoLey').value = tipo; }
    editandoId = diligenciador.id;
  } else {
    document.getElementById('modalRegistroTitulo').textContent = 'Nuevo Diligenciador';
    editandoId = null;
  }
}

function cerrarModalRegistro() {
  modalRegistro.classList.remove('activa');
  editandoId = null;
}

async function guardarRegistro() {
  const provincia = document.getElementById('provincia').value;
  const tipoLey = document.getElementById('tipoLey').value;
  if (!provincia || !tipoLey) { mostrarAlerta('Provincia y Tipo Ley son obligatorios', '#e74c3c'); return; }
  const data = {
    provincia, tipoLey,
    diligenciador: document.getElementById('diligenciador').value,
    domicilio: document.getElementById('domicilio').value,
    localidad: document.getElementById('localidad').value,
    telefono: document.getElementById('telefono').value,
    email: document.getElementById('email').value,
    expteDondeFigura: document.getElementById('expteDondeFigura').value
  };
  try {
    if (editandoId) await updateDoc(doc(db, 'diligenciadores', editandoId), data);
    else await addDoc(collection(db, 'diligenciadores'), data);
    mostrarAlerta(editandoId ? 'Actualizado' : 'Guardado');
    cerrarModalRegistro();
    await cargarDatos();
    if (provinciaActual) aplicarFiltrosProvincia();
  } catch(error) { mostrarAlerta('Error: '+error.message, '#e74c3c'); }
}

window.editarRegistro = function(id) {
  const d = diligenciadores.find(d => d.id === id);
  if (d) abrirModalRegistro(d);
};

window.eliminarRegistro = async function(id) {
  if (confirm('¿Eliminar?')) {
    await deleteDoc(doc(db, 'diligenciadores', id));
    mostrarAlerta('Eliminado');
    await cargarDatos();
    if (provinciaActual) aplicarFiltrosProvincia();
  }
};

function aplicarFiltros() {
  const texto = document.getElementById('filtroTexto').value.toLowerCase();
  const provincia = document.getElementById('filtroProvincia').value;
  const tipoLey = document.getElementById('filtroTipoLey').value;
  const filtrados = diligenciadores.filter(d => 
    (!texto || (d.diligenciador?.toLowerCase().includes(texto) || d.localidad?.toLowerCase().includes(texto) || d.email?.toLowerCase().includes(texto))) &&
    (!provincia || d.provincia === provincia) &&
    (!tipoLey || d.tipoLey === tipoLey)
  );
  const tarjetas = document.querySelectorAll('.provincia-card');
  tarjetas.forEach(card => {
    const prov = card.dataset.provincia;
    const count = filtrados.filter(d => d.provincia === prov).length;
    card.querySelector('p').textContent = `${count} diligenciador(es) registrado(s)`;
    card.style.display = (!provincia || provincia === prov) ? 'block' : 'none';
  });
  contadorRegistros.textContent = `Total de diligenciadores: ${filtrados.length}`;
}

function aplicarFiltrosProvincia() {
  const texto = document.getElementById('filtroProvinciaTexto').value.toLowerCase();
  const tipoLey = document.getElementById('filtroProvinciaTipoLey').value;
  diligenciadoresFiltrados = diligenciadores.filter(d => 
    d.provincia === provinciaActual &&
    (!texto || (d.diligenciador?.toLowerCase().includes(texto) || d.localidad?.toLowerCase().includes(texto))) &&
    (!tipoLey || d.tipoLey === tipoLey)
  );
  paginaActual = 1;
  renderTablaProvincia();
}

function renderTablaProvincia() {
  const inicio = (paginaActual-1)*registrosPorPagina;
  const datos = diligenciadoresFiltrados.slice(inicio, inicio+registrosPorPagina);
  tablaDiligenciadoresCuerpo.innerHTML = datos.length ? datos.map(d => `
    <tr>
      <td>${d.diligenciador || ''}</td><td>${d.domicilio || ''}</td><td>${d.localidad || ''}</td>
      <td>${d.telefono || ''}</td><td>${d.email || ''}</td>
      <td><span class="badge-tipo ${d.tipoLey === 'Oficio Ley' ? 'badge-oficio' : 'badge-cedula'}">${d.tipoLey || ''}</span></td>
      <td>${d.expteDondeFigura || ''}</td>
      <td class="acciones"><button class="btn-editar" onclick="editarRegistro('${d.id}')">Editar</button> <button class="btn-eliminar" onclick="eliminarRegistro('${d.id}')">Eliminar</button></td>
    </tr>
  `).join('') : '<tr><td colspan="8">No hay diligenciadores en esta provincia</td></tr>';
  const totalPag = Math.ceil(diligenciadoresFiltrados.length/registrosPorPagina);
  paginacionProvincia.innerHTML = '';
  for(let i=1;i<=totalPag;i++){
    const span = document.createElement('span');
    span.textContent = i;
    span.className = 'pagina' + (i===paginaActual ? ' activa' : '');
    span.onclick = () => { paginaActual=i; renderTablaProvincia(); };
    paginacionProvincia.appendChild(span);
  }
}

function mostrarAlerta(msg, color='#2ecc71') {
  alerta.textContent = msg;
  alerta.style.backgroundColor = color;
  alerta.style.display = 'block';
  setTimeout(()=> alerta.style.display = 'none', 3000);
}

document.getElementById('btnNuevo').onclick = () => abrirModalRegistro();
document.getElementById('modalRegistroCerrar').onclick = cerrarModalRegistro;

document.getElementById('btnCerrarProvincia').onclick = cerrarModalProvincia;

document.getElementById('filtroTexto').addEventListener('input', aplicarFiltros);
document.getElementById('filtroProvincia').addEventListener('change', aplicarFiltros);
document.getElementById('filtroTipoLey').addEventListener('change', aplicarFiltros);
document.getElementById('filtroProvinciaTexto').addEventListener('input', aplicarFiltrosProvincia);
document.getElementById('filtroProvinciaTipoLey').addEventListener('change', aplicarFiltrosProvincia);

document.querySelectorAll('.tipo-ley-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tipo-ley-btn').forEach(b=>b.classList.remove('activa'));
    btn.classList.add('activa');
    document.getElementById('tipoLey').value = btn.dataset.tipo;
  };
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tabRequisitos').classList.toggle('active', tab==='requisitos');
    document.getElementById('tabDiligenciadores').classList.toggle('active', tab==='diligenciadores');
  };
});

cargarProvincias();  // muestra las tarjetas sin conteo aún
cargarDatos();       // carga los datos reales y actualiza
